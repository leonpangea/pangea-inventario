<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pangea · Inventario</title>

<style>
  :root{--verde:#1A3A1C;--verde2:#2C5F2E;--naranja:#F4A261;--crema:#FDF3E7;--rojo:#C0392B;
        --gris:#6B6B6B;--tan:#D4B896;--tinta:#1A1A1A;--bg:#F6F1E7;--azul:#3b7dd8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tinta);line-height:1.45;padding-bottom:40px;}
  header{position:sticky;top:0;z-index:30;background:var(--verde);color:#fff;padding:12px 15px 10px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .brand{display:flex;align-items:center;justify-content:space-between;}
  .brand h1{font-size:16.5px;margin:0;font-weight:800;letter-spacing:.3px;}
  .brand .sp{font-size:11.5px;color:var(--naranja);font-weight:600;}
  .who{font-size:11px;color:#cfe0d0;cursor:pointer;text-decoration:underline;}
  .tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;}
  .tab{flex:0 0 auto;border:none;border-radius:16px;padding:7px 14px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.14);color:#dfe9df;cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--naranja);color:var(--verde);}
  .wrap{padding:12px;max-width:760px;margin:0 auto;}
  #search{width:100%;border:1.5px solid var(--tan);border-radius:11px;padding:10px 13px;font-size:15px;margin-bottom:12px;background:#fff;}
  #search:focus{outline:none;border-color:var(--verde2);}
  .card{background:#fff;border:1px solid var(--tan);border-radius:12px;overflow:hidden;margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid #f0eadd;}
  .row:last-child{border-bottom:none;}
  .row .nm{flex:1;font-size:14px;font-weight:600;}
  .row .prov{font-size:10.5px;color:var(--gris);font-weight:400;}
  .stock{font-size:15px;font-weight:800;color:var(--verde2);text-align:right;white-space:nowrap;}
  .stock.low{color:var(--rojo);}
  .stock.zero{color:var(--gris);}
  .lotes{font-size:10.5px;color:var(--gris);margin-top:2px;}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;}
  .badge.cad{background:#fdecea;color:var(--rojo);}
  .badge.ok{background:#e3f2e3;color:var(--verde2);}
  h3.sec{font-size:12.5px;color:var(--verde2);text-transform:uppercase;letter-spacing:.4px;margin:6px 3px 8px;font-weight:800;}
  label{display:block;font-size:12px;font-weight:700;color:var(--gris);margin:10px 3px 4px;}
  input,select,textarea{width:100%;border:1.5px solid var(--tan);border-radius:10px;padding:11px;font-size:15px;background:#fff;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde2);}
  .btn{width:100%;border:none;border-radius:12px;font-size:15px;font-weight:800;padding:14px;cursor:pointer;margin-top:12px;}
  .btn.p{background:var(--verde2);color:#fff;}
  .btn.s{background:#fff;color:var(--verde2);border:1.5px solid var(--tan);}
  .btn.o{background:var(--naranja);color:var(--verde);}
  .btn:active{filter:brightness(.94);}
  .btn:disabled{opacity:.4;}
  .foto{width:100%;border-radius:10px;margin:8px 0;}
  .fotoph{width:100%;height:120px;border:2px dashed var(--tan);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--gris);font-size:13px;background:#faf6ee;margin:8px 0;}
  .lote-item{border:1px solid var(--tan);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--crema);}
  .lote-item .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;}
  .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px;}
  .lgrid input{padding:8px;font-size:13.5px;}
  .del{border:none;background:transparent;color:var(--rojo);font-size:16px;cursor:pointer;}
  .ing{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0eadd;font-size:13.5px;}
  .ing .q{font-weight:800;color:var(--verde2);white-space:nowrap;}
  .ing select{padding:6px;font-size:12px;}
  .empty{text-align:center;color:var(--gris);padding:36px 18px;font-size:14px;}
  .prodrow{padding:11px 13px;border-bottom:1px solid #f0eadd;cursor:pointer;}
  .prodrow:active{background:var(--crema);}
  .prodrow .t{font-size:14px;font-weight:700;}
  .prodrow .s{font-size:11px;color:var(--gris);}
  .traza{background:var(--crema);border-radius:10px;padding:12px;margin-bottom:10px;font-size:13px;}
  .traza b{color:var(--verde2);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--verde);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:18px;}
  .modal.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:440px;border-radius:16px;padding:18px;max-height:88vh;overflow:auto;}
  .sheet h3{margin:0 0 4px;color:var(--verde);font-size:17px;}
  .mbtns{display:flex;gap:10px;margin-top:14px;}
  .mbtns button{flex:1;border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;}
  .cancel{background:#eee;color:var(--gris);}
  .ok{background:var(--verde2);color:#fff;}
  .center{padding:40px;text-align:center;color:var(--gris);}
  .login{max-width:420px;margin:8vh auto 0;padding:0 18px;text-align:center;}
  .login h2{color:var(--verde);font-size:20px;}
  .pbtn{width:100%;border:1.5px solid var(--tan);background:#fff;border-radius:13px;padding:15px;font-size:16px;font-weight:700;color:var(--verde2);cursor:pointer;margin-bottom:9px;}
</style>
</head>

async function init(){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  renderLogin();
}
function renderLogin(){
  const nombres=['Encargado','Obrador','Cocina'];
  let h='<div class="login"><h2>¿Quién eres?</h2><p style="color:var(--gris);font-size:13px">Toca tu rol para entrar</p>';
  nombres.forEach(n=>h+=`<button class="pbtn" data-n="${n}">${n}</button>`);
  h+='<input id="otro" placeholder="…o escribe tu nombre" style="margin-top:8px"><button class="pbtn" id="otroBtn" style="margin-top:8px">Entrar</button></div>';
  $('#app').innerHTML=h;
  document.querySelectorAll('.pbtn[data-n]').forEach(b=>b.onclick=()=>entrar(b.dataset.n));
  $('#otroBtn').onclick=()=>{const v=$('#otro').value.trim();if(v)entrar(v);};
}
async function entrar(n){
  persona=n; $('#who').textContent='👤 '+n; $('#who').style.display='block';
  $('#who').onclick=()=>{persona=null;$('#tabs').style.display='none';$('#who').style.display='none';renderLogin();};
  $('#tabs').style.display='flex';
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');render();});
  await cargar(); render();
}
async function cargar(){
  const {data:m}=await sb.from('inv_materias').select('*').order('nombre');
  const {data:l}=await sb.from('inv_lotes').select('*').eq('agotado',false).order('caducidad');
  materias=m||[]; lotes=l||[];
}
function stockDe(nombre){
  return lotes.filter(l=>l.materia===nombre).reduce((a,l)=>a+Number(l.cantidad_actual),0);
}
// Conversión a unidad BASE: peso→gramos, volumen→ml, resto→tal cual
function aBase(cant,unidad){
  const u=(unidad||'').toLowerCase().trim();
  if(u==='kg')return cant*1000;
  if(u==='g'||u==='gr'||u==='gramos')return cant;
  if(u==='l'||u==='litro'||u==='litros')return cant*1000;
  if(u==='ml')return cant;
  return cant; // ud, cajas, etc.
}
// familia de unidad para saber si son compatibles
function familia(unidad){
  const u=(unidad||'').toLowerCase().trim();
  if(['kg','g','gr','gramos'].includes(u))return 'peso';
  if(['l','litro','litros','ml'].includes(u))return 'vol';
  return 'ud';
}
function lotesDe(nombre){return lotes.filter(l=>l.materia===nombre);}

function render(){
  if(tab==='inv')renderInv();
  else if(tab==='rec')renderRecibir();
  else if(tab==='prod')renderProducir();
  else renderTraza();
}

// ---------- STOCK ----------
function renderInv(){
  let list=materias.slice();
  const t=norm(q).trim();
  if(t)list=list.filter(m=>norm(m.nombre).includes(t)||norm(m.proveedor).includes(t));
  let h='<div class="wrap"><input id="search" placeholder="Buscar materia prima…" value="'+q+'">';
  const conStock=list.filter(m=>stockDe(m.nombre)>0);
  const sinStock=list.filter(m=>stockDe(m.nombre)<=0);
  h+=`<h3 class="sec">Con stock · ${conStock.length}</h3>`;
  if(conStock.length){h+='<div class="card">';conStock.forEach(m=>h+=invRow(m));h+='</div>';}
  else h+='<div class="empty">Sin stock registrado todavía.<br>Ve a “Recibir” para dar entrada.</div>';
  if(sinStock.length){h+=`<h3 class="sec">Sin stock · ${sinStock.length}</h3><div class="card">`;
    sinStock.slice(0,60).forEach(m=>h+=invRow(m));h+='</div>';}
  h+='</div>';
  $('#app').innerHTML=h;
  $('#search').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;renderInv();$('#search').focus();$('#search').setSelectionRange(p,p);};
}
function invRow(m){
  const s=stockDe(m.nombre); const ls=lotesDe(m.nombre);
  const cls=s<=0?'zero':(s<=Number(m.stock_min)?'low':'');
  let lotesTxt='';
  if(ls.length){
    lotesTxt=ls.map(l=>{
      const cad=l.caducidad?new Date(l.caducidad):null;
      const venc=cad&&cad<new Date();
      return `${l.lote||'s/lote'}${l.caducidad?' · cad '+l.caducidad.slice(8)+'/'+l.caducidad.slice(5,7):''}${venc?' ⚠':''}`;
    }).join('  ·  ');
  }
  return `<div class="row"><div class="nm">${m.nombre}<div class="prov">${m.proveedor||''}</div>
    ${lotesTxt?'<div class="lotes">Lotes: '+lotesTxt+'</div>':''}</div>
    <div class="stock ${cls}">${s>0?(Math.round(s*100)/100):'—'}<div class="prov" style="text-align:right">${m.unidad}</div></div></div>`;
}

// ---------- RECIBIR ----------
let recFoto='', recLineas=[];
function renderRecibir(){
  let h='<div class="wrap"><h3 class="sec">Nueva recepción de mercadería</h3>';
  h+='<label>Proveedor</label><select id="recProv"><option value="">— elegir —</option>';
  [...new Set(materias.map(m=>m.proveedor).filter(Boolean))].sort().forEach(p=>h+=`<option>${p}</option>`);
  h+='</select>';
  h+='<label>Foto del albarán / factura</label>';
  h+= recFoto?`<img class="foto" src="${recFoto}">`:'<div class="fotoph">Sin foto</div>';
  h+='<button class="btn s" id="fotoBtn">📷 '+(recFoto?'Cambiar':'Hacer/subir')+' foto</button><input type="file" id="fotoIn" accept="image/*" capture="environment" style="display:none">';
  h+= recFoto?'<button class="btn o" id="iaBtn">✨ Leer factura automáticamente</button>':'';
  h+='<h3 class="sec" style="margin-top:16px">Productos recibidos</h3>';
  h+='<div id="lineas"></div>';
  h+='<button class="btn s" id="addLinea">＋ Añadir producto</button>';
  h+='<button class="btn p" id="guardarRec">Guardar recepción y sumar al stock</button>';
  h+='</div>';
  $('#app').innerHTML=h;
  pintarLineas();
  $('#fotoBtn').onclick=()=>$('#fotoIn').click();
  $('#fotoIn').onchange=recImagen;
  if($('#iaBtn'))$('#iaBtn').onclick=leerFacturaIA;
  $('#addLinea').onclick=()=>{recLineas.push({materia:'',lote:'',cad:'',cant:'',ud:'kg'});pintarLineas();};
  $('#guardarRec').onclick=guardarRecepcion;
  if($('#recProv'))$('#recProv').onchange=()=>{};
}
function pintarLineas(){
  const cont=$('#lineas'); if(!cont)return;
  if(!recLineas.length){cont.innerHTML='<div class="empty" style="padding:18px">Añade los productos del albarán.</div>';return;}
  let h='';
  recLineas.forEach((l,i)=>{
    h+=`<div class="lote-item"><div class="top"><span>Producto ${i+1}</span><button class="del" data-del="${i}">🗑</button></div>
      <input list="matlist" data-i="${i}" data-f="materia" placeholder="Materia prima" value="${l.materia}">
      <div class="lgrid">
        <input data-i="${i}" data-f="cant" type="number" step="0.01" inputmode="decimal" placeholder="Cantidad" value="${l.cant}">
        <input data-i="${i}" data-f="ud" placeholder="unidad" value="${l.ud}">
        <input data-i="${i}" data-f="lote" placeholder="Nº lote" value="${l.lote}">
        <input data-i="${i}" data-f="cad" type="date" value="${l.cad}">
      </div></div>`;
  });
  h+='<datalist id="matlist">'+materias.map(m=>`<option value="${m.nombre}">`).join('')+'</datalist>';
  cont.innerHTML=h;
  cont.querySelectorAll('input[data-i]').forEach(inp=>{
    inp.oninput=()=>{const i=+inp.dataset.i,f=inp.dataset.f;recLineas[i][f]=inp.value;
      if(f==='materia'){const m=materias.find(x=>x.nombre===inp.value);if(m){recLineas[i].ud=m.unidad;const u=cont.querySelector(`input[data-i="${i}"][data-f="ud"]`);if(u)u.value=m.unidad;}}};
  });
  cont.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{recLineas.splice(+b.dataset.del,1);pintarLineas();});
}
function recImagen(ev){
  const file=ev.target.files[0];if(!file)return;toast('Procesando foto…');
  const img=new Image(),rd=new FileReader();
  rd.onload=e=>img.src=e.target.result;
  img.onload=()=>{let{width:w,height:hh}=img;const MAX=1600;
    if(w>hh&&w>MAX){hh=hh*MAX/w;w=MAX;}else if(hh>MAX){w=w*MAX/hh;hh=MAX;}
    const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
    cv.getContext('2d').drawImage(img,0,0,w,hh);
    recFoto=cv.toDataURL('image/jpeg',0.85);renderRecibir();toast('Foto lista ✓');};
  rd.readAsDataURL(file);
}
async function leerFacturaIA(){
  if(!recFoto){toast('Primero haz una foto');return;}
  toast('Leyendo factura con IA… (10-20 seg)');
  const btn=$('#iaBtn'); if(btn){btn.disabled=true;btn.textContent='⏳ Leyendo…';}
  try{
    const b64=recFoto.split(',')[1];
    const media=recFoto.substring(5,recFoto.indexOf(';'));
    const resp=await fetch('/.netlify/functions/leer-factura',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({imagen:b64,media_type:media,materias:materias.map(m=>m.nombre)})
    });
    const data=await resp.json();
    if(data.error){toast('IA: '+data.error);if(btn){btn.disabled=false;btn.textContent='✨ Leer factura automáticamente';}return;}
    if(data.proveedor&&$('#recProv')){
      const opts=[...$('#recProv').options].map(o=>o.value);
      const match=opts.find(o=>o&&norm(o).includes(norm(data.proveedor).split(' ')[0]));
      if(match)$('#recProv').value=match;
    }
    if(data.productos&&data.productos.length){
      recLineas=data.productos.map(p=>({
        materia:emparejarMateria(p.nombre),
        cant:p.cantidad!=null?String(p.cantidad):'',
        ud:p.unidad||'kg',
        lote:p.lote||'',
        cad:p.caducidad||''
      }));
      pintarLineas();
      toast('✓ '+recLineas.length+' productos leídos · revisa y confirma');
    } else toast('No se detectaron productos, añádelos a mano');
  }catch(e){toast('Error: '+e.message);}
  if(btn){btn.disabled=false;btn.textContent='✨ Leer factura automáticamente';}
}
function emparejarMateria(nombre){
  const n=norm(nombre).trim();
  // solo emparejamos si es idéntico o el catálogo contiene el nombre completo leído
  let best='',bs=0;
  materias.forEach(m=>{const mn=norm(m.nombre).trim();let s=0;
    if(mn===n)s=100;                                   // idéntico
    else if(mn===n+'s'||n===mn+'s')s=95;               // plural/singular
    else if(mn.includes(n)&&n.length>=5)s=70;          // el catálogo contiene TODO lo leído
    if(s>bs){bs=s;best=m.nombre;}});
  // umbral alto: si no es casi idéntico, respetamos el nombre de la factura
  return bs>=70?best:nombre;
}
async function guardarRecepcion(){
  const prov=$('#recProv')?$('#recProv').value:'';
  const validas=recLineas.filter(l=>l.materia&&parseFloat(l.cant)>0);
  if(!validas.length){toast('Añade al menos un producto con cantidad');return;}
  const {data:rec,error:e1}=await sb.from('inv_recepciones').insert(
    {fecha:hoy(),proveedor:prov,foto:recFoto,persona,nota:''}).select().single();
  if(e1){toast('Error: '+e1.message);return;}
  for(const l of validas){
    const cant=parseFloat(l.cant);
    await sb.from('inv_lotes').insert({materia:l.materia,lote:l.lote,caducidad:l.cad||null,
      cantidad_inicial:cant,cantidad_actual:cant,unidad:l.ud,recepcion_id:rec.id,fecha_entrada:hoy()});
    // crear materia si no existe
    if(!materias.find(m=>m.nombre===l.materia))
      await sb.from('inv_materias').insert({nombre:l.materia,unidad:l.ud,proveedor:prov}).then(()=>{},()=>{});
  }
  recFoto='';recLineas=[];await cargar();toast('Recepción guardada · stock actualizado ✓');
  tab='inv';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tab[data-t="inv"]').classList.add('active');render();
}

// ---------- PRODUCIR ----------
let prodQ='';
function renderProducir(){
  let list=RECETAS.filter(r=>r.i.some(i=>i.q));
  const t=norm(prodQ).trim();
  if(t)list=list.filter(r=>norm(r.n).includes(t));
  let h='<div class="wrap"><h3 class="sec">Marcar producción de una receta</h3>';
  h+='<input id="psearch" placeholder="Buscar receta…" value="'+prodQ+'">';
  h+='<div class="card" style="margin-top:10px">';
  list.slice(0,50).forEach(r=>{h+=`<div class="prodrow" data-c="${r.c}"><div class="t">${r.n}</div>
    <div class="s">${r.c} · ${r.i.length} ingredientes</div></div>`;});
  h+='</div></div>';
  $('#app').innerHTML=h;
  $('#psearch').oninput=e=>{prodQ=e.target.value;const p=e.target.selectionStart;renderProducir();$('#psearch').focus();$('#psearch').setSelectionRange(p,p);};
  document.querySelectorAll('.prodrow').forEach(el=>el.onclick=()=>abrirProd(el.dataset.c));
}
function abrirProd(cod){
  const r=RECETAS.find(x=>x.c===cod);
  let h=`<h3>${r.n}</h3><p style="color:var(--gris);font-size:12.5px;margin:2px 0 12px">${r.c}</p>`;
  h+='<label>Multiplicador (×1, ×2…)</label><input id="pmult" type="number" step="0.5" min="0.5" value="1">';
  h+='<label>Nº de lote del producto final</label><input id="plote" placeholder="ej. CR-'+hoy().replace(/-/g,'')+'">';
  h+='<h3 style="font-size:13px;margin:14px 0 6px;color:var(--verde2)">Se descontará del stock:</h3>';
  h+='<div id="consumos"></div>';
  h+='<div class="mbtns"><button class="cancel" id="pCancel">Cancelar</button><button class="ok" id="pOk">Confirmar producción</button></div>';
  $('#sheet').innerHTML=h; $('#modal').classList.add('show');
  const pintar=()=>{
    const mult=parseFloat($('#pmult').value)||1;
    let c='';
    r.i.forEach(ing=>{
      if(!ing.q){c+=`<div class="ing"><span style="flex:1">${ing.n}</span><span class="s" style="color:var(--gris)">sin cantidad</span></div>`;return;}
      const necesita=ing.q*mult;
      const mat=matchMateria(ing.n);
      const matObj=materias.find(m=>m.nombre===mat);
      const udStock=matObj?matObj.unidad:'kg';
      // convertir ambos a base para comparar
      const necesitaBase=aBase(necesita,ing.u);
      const dispBase=lotes.filter(l=>l.materia===mat).reduce((a,l)=>a+aBase(Number(l.cantidad_actual),l.unidad),0);
      const compat=familia(ing.u)===familia(udStock)||familia(ing.u)==='ud';
      const falta=compat && dispBase<necesitaBase;
      const dispMostrar=stockDe(mat);
      c+=`<div class="ing"><span style="flex:1">${ing.n}</span>
        <span class="q" style="color:${falta?'var(--rojo)':'var(--verde2)'}">${Math.round(necesita*100)/100} ${ing.u||''}</span></div>
        ${falta?`<div style="font-size:10.5px;color:var(--rojo);margin:-4px 0 4px">stock: ${Math.round(dispMostrar*100)/100} ${udStock} — insuficiente</div>`:''}
        ${!compat?`<div style="font-size:10.5px;color:var(--naranja);margin:-4px 0 4px">⚠ revisar unidad (${ing.u} vs ${udStock})</div>`:''}`;
    });
    $('#consumos').innerHTML=c;
  };
  pintar();
  $('#pmult').oninput=pintar;
  $('#pCancel').onclick=()=>$('#modal').classList.remove('show');
  $('#pOk').onclick=()=>confirmarProd(r);
}
function matchMateria(ingNombre){
  const n=norm(ingNombre);
  let best=null,bs=0;
  materias.forEach(m=>{const mn=norm(m.nombre);let s=0;
    if(mn===n)s=100;else if(mn.includes(n)||n.includes(mn))s=50;
    else{const w=n.split(/\s+/);if(w.some(x=>x.length>3&&mn.includes(x)))s=20;}
    if(s>bs){bs=s;best=m.nombre;}});
  return best||ingNombre;
}
async function confirmarProd(r){
  const mult=parseFloat($('#pmult').value)||1;
  const loteFinal=$('#plote').value.trim();
  if(!loteFinal){toast('Pon el nº de lote del producto final');return;}
  const {data:prod,error:e1}=await sb.from('inv_producciones').insert(
    {receta_cod:r.c,receta_nombre:r.n,lote_final:loteFinal,multiplicador:mult,fecha:hoy(),persona}).select().single();
  if(e1){toast('Error: '+e1.message);return;}
  // descontar por FIFO (primero los que caducan antes)
  for(const ing of r.i){
    if(!ing.q)continue;
    let necesitaBase=aBase(ing.q*mult,ing.u);  // lo que pide la receta, en base
    const mat=matchMateria(ing.n);
    const dispo=lotes.filter(l=>l.materia===mat&&Number(l.cantidad_actual)>0)
                     .sort((a,b)=>(a.caducidad||'9999')<(b.caducidad||'9999')?-1:1);
    for(const l of dispo){
      if(necesitaBase<=0.0001)break;
      const loteBase=aBase(Number(l.cantidad_actual),l.unidad);  // stock del lote en base
      const usarBase=Math.min(necesitaBase,loteBase);
      // convertir lo usado de base de vuelta a la unidad del lote
      const factor = l.unidad&&['kg','l','litro','litros'].includes(l.unidad.toLowerCase())?1000:1;
      const usarEnUnidadLote=usarBase/factor;
      const nuevo=Number(l.cantidad_actual)-usarEnUnidadLote;
      await sb.from('inv_lotes').update({cantidad_actual:nuevo,agotado:nuevo<=0.0001}).eq('id',l.id);
      await sb.from('inv_consumos').insert({produccion_id:prod.id,materia:mat,lote_id:l.id,
        lote_texto:l.lote||'',cantidad:usarEnUnidadLote,unidad:l.unidad});
      necesitaBase-=usarBase;
    }
  }
  $('#modal').classList.remove('show');
  await cargar();toast('Producción registrada · lote '+loteFinal+' ✓');
  tab='inv';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tab[data-t="inv"]').classList.add('active');render();
}

// ---------- TRAZABILIDAD ----------
let trazaQ='';
async function renderTraza(){
  let h='<div class="wrap"><h3 class="sec">Buscar trazabilidad de un lote</h3>';
  h+='<input id="tsearch" placeholder="Nº de lote de producto final…" value="'+trazaQ+'">';
  h+='<div id="trazaRes"></div></div>';
  $('#app').innerHTML=h;
  $('#tsearch').oninput=e=>{trazaQ=e.target.value;buscarTraza();};
  buscarTraza();
}
async function buscarTraza(){
  const cont=$('#trazaRes'); if(!cont)return;
  const t=trazaQ.trim();
  if(!t){cont.innerHTML='<div class="empty">Escribe un nº de lote para ver qué materias primas se usaron.</div>';return;}
  const {data:prods}=await sb.from('inv_producciones').select('*').ilike('lote_final','%'+t+'%').order('fecha',{ascending:false});
  if(!prods||!prods.length){cont.innerHTML='<div class="empty">No se encontró ese lote.</div>';return;}
  let h='';
  for(const p of prods){
    const {data:cons}=await sb.from('inv_consumos').select('*').eq('produccion_id',p.id);
    h+=`<div class="traza"><b>${p.receta_nombre}</b> · lote <b>${p.lote_final}</b><br>
      <span style="font-size:11.5px;color:var(--gris)">${p.fecha} · ×${p.multiplicador} · por ${p.persona||'—'}</span>
      <div style="margin-top:8px;font-size:12.5px">Materias primas usadas:</div>`;
    if(cons&&cons.length){
      cons.forEach(c=>{h+=`<div style="font-size:12.5px;padding:3px 0;border-bottom:1px solid #eadfce">
        • ${c.materia} — lote <b>${c.lote_texto||'s/lote'}</b> — ${Math.round(c.cantidad*100)/100} ${c.unidad||''}</div>`;});
    }else h+='<div style="font-size:12px;color:var(--gris)">Sin consumos registrados.</div>';
    h+='</div>';
  }
  cont.innerHTML=h;
}

init();
</script>
