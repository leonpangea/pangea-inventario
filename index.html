  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}

  .brand .sp{font-size:11.5px;color:var(--naranja);font-weight:600;}
  .who{font-size:11px;color:#cfe0d0;cursor:pointer;text-decoration:underline;}
  .tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;}

  .row .prov{font-size:10.5px;color:var(--gris);font-weight:400;}

do cítrico va al zumo de manzana nada más exprimirla — no esperar, o el zumo se oxida y pardea. Ni la zanahoria ni la remolacha se pelan: se lavan bien y van enteras a la exprimidora. La remolacha se exprime la última porque tiñe. Ojo con la merma (2 kg de zanahoria dan solo ~860 gr de zumo): producir según demanda, la vida útil es corta. Equipamiento necesario: Exprimidora · Recipiente grande · Baldes de 3 litros con tapa", "actualizado": "2026-09-18T13:19:40.07641+00:00", "datos": []}, {"codigo": "PB-OBR-DUL-071", "nombre": "SIROPE DE CARDAMOMO (CARDAMOM BUN)", "tipo": "Sirope de barra", "rendimiento": "~7.000 gr (≈6,5 L)", "lote": "≈9,1 kg", "envase": "Botella 1 L · Bolsa vacío 25×35", "equipo": "Basculante o rondón · Bolsa de infusión o estameña · Mortero · Refractómetro · Abatidor · Envasadora", "tiempo": "~45 min + 12 h de reposo", "vida": "2 meses nevera · 6 meses congelado", "masa_base": "", "ingredientes": [["azúcar moreno", "4500", "gr", "Calculado para cerrar en 60 °Brix tras colar."], ["agua", "3200", "ml", "Agua caliente. Caliente, nunca fría: salpica sobre la mantequilla."], ["mantequilla", "1300", "gr", "Mantequilla sin sal — ver alérgenos. Se retira al final."], ["cardamomo", "120", "gr", "Semillas de cardamomo verde · en bolsa de infusión"], ["sal", "20", "gr", "Sal fina · Equivale a la pizca del original."]], "pasos": [["1", "Pesar todo. Machacar las semillas de cardamomo solo para romperlas y meterlas en bolsa de infusión o atadas en estameña. No se pulverizan: el sirope saldría turbio y amargo.", "~20 min", ""], ["2", "Fundir la mantequilla en el basculante o rondón ancho y hacer beurre noisette: remover sin parar hasta color ámbar y olor a fruto seco. Unas motas marrones están bien; si se vuelven negras, se ha pasado y hay que empezar de nuevo.", "10-15 min", "140-150°"], ["3", "Retirar del fuego de inmediato y añadir el azúcar moreno, el cardamomo majado y la sal. Remover hasta que el azúcar se empape de mantequilla.", "~3 min", ""], ["4", "Volver al fuego medio y añadir el agua caliente POCO A POCO sin dejar de remover. De golpe o fría, salpica.", "~5 min", "90°"], ["5", "Cocer a hervor suave removiendo hasta que el azúcar esté totalmente disuelto y el cardamomo haya infusionado.", "10-15 min", "95-100°"], ["6", "Volcar en cubeta, tapar, abatir y meter en cámara hasta que la mantequilla se separe y solidifique formando una costra en la superficie.", "12 h", "<4°"], ["7", "Retirar la costra de mantequilla con espumadera. NO se tira: se reserva etiquetada como beurre noisette para cookies y bollería.", "~10 min", "<4°"], ["8", "Colar: sacar la bolsa del cardamomo y exprimirla bien; retiene ~300 gr.", "~15 min", ""], ["9", "FIN DE PROCESO — CHEQUEAR BRIX sobre el sirope ya colado y sin grasa. Objetivo 60 (válido 58-62). Por debajo, reducir a fuego suave midiendo cada 5 min; por encima, aflojar con agua caliente.", "hasta 60 °Bx", ""], ["10", "Envasar: 2-3 botellas de 1 L a nevera para barra y el resto en bolsas de vacío de 1 L al congelador. Etiquetar todas con nombre, código, lote y fecha.", "~20 min", "<4°"]], "alergenos": ["Lácteos"], "conservacion": {"Envase": "Botella 1 L · Bolsa vacío 25×35 cm", "Nevera": "2 meses (botella cerrada)", "Congelador": "6 meses", "Etiquetado": "Nombre, código, nº de lote y fecha de producción", "En servicio": "Botella abierta en barra: 2 semanas", "Subproducto": "Beurre noisette: 2 semanas en nevera, etiquetado"}, "observaciones": "PUNTO FINAL — 60 °BRIX: Medir SIEMPRE con el sirope ya colado y sin la capa de grasa: la mantequilla en suspensión falsea la lectura del refractómetro. Rango válido 58-62. Cardamomo en semilla: siempre semilla, nunca vaina. La semilla va SIEMPRE en bolsa: se parte en fino al cocer y deja arenilla en el fondo de la botella. Cardamomo — pendiente de validar: El propio autor avisa de que se le va de cardamomo. Catar el primer lote y fijar el valor en la v2.0. El beurre noisette es la receta: Todo el carácter está en el tostado de la mantequilla. Si se queda pálida, el sirope sabe solo a azúcar moreno; si se quema, amarga todo el lote y no hay arreglo. Origen: Del reel de @littlejoycoffee (Cardamom Bun Syrup): 2 tazas de azúcar moreno, 1 taza de agua, 1 barra de mantequilla, 50 gr de cardamomo y una pizca de sal. Escalado ×12,5 y agua recalculada para cerrar en 60 °Brix con el mismo rendimiento que la PB-OBR-DUL-069. Equipamiento: Basculante o rondón · Bolsa de infusión o estameña · Mortero · Refractómetro · Abatidor · Envasadora", "actualizado": "2026-09-19T07:43:29.102513+00:00", "datos": []}, {"codigo": "PB-OBR-DUL-072", "nombre": "SIROPE DE LAVANDA", "tipo": "Sirope de barra", "rendimiento": "PENDIENTE DE PESAR", "lote": "1 kg azúcar · 1 L agua", "envase": "Bolsa de 500 ml", "equipo": "Olla · Báscula · Colador fino · Envasadora", "tiempo": "~30 min + enfriado", "vida": "6 meses congelado", "masa_base": "", "ingredientes": [["azúcar", "1000", "gr", "Azúcar blanco"], ["agua", "1000", "ml", ""], ["lavanda culinaria seca", "50", "gr", "Lavandula angustifolia. La lavandina sabe a alcanfor."], ["sal", "2", "gr", "Sal fina · 0,1 % del lote. Propuesta de Pangea: catar y confirmar."]], "pasos": [["1", "Mezclar en la olla el azúcar, el agua y la lavanda.", "~5 min", ""], ["2", "Llevar al fuego y cocer removiendo hasta que el azúcar esté completamente disuelto.", "a definir", ""], ["3", "Retirar del fuego, añadir la sal y remover hasta integrar.", "~2 min", ""], ["4", "Colar para retirar la lavanda. Apretar poco: cuanto más se exprime, más amargo sale.", "~5 min", ""], ["5", "Dejar enfriar por completo. No envasar en caliente.", "hasta frío", "0-4°C"], ["6", "PESAR EL SIROPE COLADO Y FRÍO y anotar el dato. Es lo que cierra el rendimiento de esta ficha.", "~2 min", ""], ["7", "Envasar en bolsas de 500 ml, etiquetar con nombre, código, lote y fecha, y congelar.", "~15 min", "-18°C"]], "alergenos": [], "conservacion": {"Envase": "Bolsa de 500 ml", "Congelador": "6 meses", "Botella en barra": "2 semanas en nevera (a confirmar con el primer lote)", "Textura congelado": "No endurece: a 50 °Brix queda espeso, tipo slush. Es normal."}, "observaciones": "Concentración: ~50 °Brix (1 kg de azúcar por 1 L de agua), por debajo del estándar de 60 de la casa. Se compensa conservando en congelador. Sin ácido cítrico, y es a propósito: La caseína de la leche precipita por debajo de pH 4,6, así que un sirope acidulado corta el matcha latte — y con bebida de avena o de almendra, antes todavía. Por eso este sirope no lleva ácido. La contrapartida es que se conserva solo por frío: congelado, nunca en despensa. A probar en el siguiente lote: Ahora la lavanda entra desde el principio y hierve con el almíbar, y eso extrae el alcanfor: es lo que empuja el sabor hacia el jabón. Alternativa a catar: disolver el azúcar en el agua, retirar del fuego y ahí infusionar la lavanda tapada 10-15 min antes de colar. Comparar las dos y fijar la buena en la v2.0. Rendimiento pendiente: La ficha no se puede cerrar sin él. En la próxima tanda: tarar una jarra en la báscula, volcar el sirope ya colado y frío y anotar los gramos. Entran 2.052 gr; se pierde lo que evapora al hervir y lo que retiene la lavanda, así que el dato real quedará por debajo. Equipamiento necesario: Olla · Báscula · Colador fino · Jarra · Bolsas de 500 ml · Envasadora", "actualizado": "2026-09-19T09:58:15.296204+00:00", "datos": [["TAMAÑO LOTE", "1 kg azúcar · 1 L agua"], ["RENDIMIENTO", "PENDIENTE DE PESAR"], ["CONCENTRACIÓN", "~50 °Brix"], ["ENVASADO", "Bolsas de 500 ml"], ["TIEMPO ACTIVO", "~30 min + enfriado"], ["VIDA ÚTIL", "6 meses congelado"]]}, {"codigo": "PB-OBR-DUL-073", "nombre": "MEZCLA DE ESPECIAS CHAI", "tipo": "Especias / mezcla base", "rendimiento": "~250 tazas", "lote": "500 gr", "envase": "Bote hermético opaco", "equipo": "Báscula de precisión (0,1 gr) · Molinillo de especias · Tamiz fino · Bol seco", "tiempo": "~15 min", "vida": "6 meses", "masa_base": "", "ingredientes": [["canela", "240", "gr", "Canela en polvo · 48 % del lote. Es la base de la mezcla."], ["cardamomo", "80", "gr", "Cardamomo molido · 16 % del lote pero el 65 % del coste. Se compra en semilla sin vaina: moler justo antes."], ["jengibre en polvo", "80", "gr", "16 %. Jengibre SECO molido, no el fresco del sirope de limón y jengibre."], ["clavo molido", "40", "gr", "8 %. Muy dominante: no pasarse."], ["nuez moscada", "40", "gr", "Nuez moscada molida · 8 %. Si es entera, rallar al momento."], ["pimienta negra", "20", "gr", "Pimienta · Pimienta negra molida · 4 %. Aporta el punto picante del chai."]], "pasos": [["1", "Comprobar que todas las especias están molidas finas. Si el cardamomo viene en semilla, molerlo en molinillo justo antes de mezclar: molido pierde aroma en pocas semanas.", "~5 min", ""], ["2", "Pesar cada especia por separado en báscula de precisión, siguiendo el orden de la tabla. La pimienta y el clavo son los que más se notan si se pasa la mano: pesarlos con cuidado.", "~5 min", ""], ["3", "Mezclar en bol seco con varilla hasta que el color sea uniforme, sin vetas claras ni oscuras.", "~2 min", ""], ["4", "Pasar por tamiz fino para romper los grumos de canela y volver a mezclar.", "~2 min", ""], ["5", "Envasar en bote hermético opaco. Etiquetar con nombre, lote y fecha.", "~1 min", ""]], "alergenos": [], "conservacion": {"Envase": "Bote hermético opaco", "Despensa": "6 meses", "Temperatura": "Ambiente, lugar fresco y seco", "Observación": "Etiquetar con fecha y lote. No guardar cerca del horno ni al lado de la cafetera."}, "observaciones": "PROPORCIONES PENDIENTES DE CONFIRMAR: la ficha antigua del cuadernillo listaba estas seis especias sin cantidades y con «rendimiento variable según lote». Las proporciones de aquí (canela 6 · cardamomo 2 · jengibre 2 · clavo 1 · nuez moscada 1 · pimienta 0,5) son una propuesta a partir del consenso de recetas publicadas de chai spice mix, escalada a 500 gr. Cocina debe validarlas o corregirlas. Uso en barra: 2 gr (una cucharadita rasa) por Café Chai Latte PB-BEB-012, disueltos con el espresso antes de añadir la leche; un lote de 500 gr da unas 250 tazas. Coste: 35,90 €/kg con los precios de las facturas de jun-ago 2026, es decir 0,072 € por taza; el cardamomo es el 65 % del coste. Puntos de control: color uniforme marrón canela sin vetas · sin grumos tras el tamizado · aroma vivo al abrir el bote (si huele plano, la mezcla ha pasado de vida útil).", "actualizado": "2026-09-20T07:11:01.855737+00:00", "datos": []}, {"codigo": "PB-OBR-DUL-074", "nombre": "CREMA INGLESA (THERMOMIX)", "tipo": "Crema / salsa dulce", "rendimiento": "~1,3 kg · ~21 raciones de 60 gr", "lote": "1 tanda Thermomix (1.360 gr)", "envase": "Biberón o táper 1 L con film a contacto", "equipo": "Thermomix con mariposa · Termómetro · Colador fino · Abatidor o baño de hielo", "tiempo": "~20 min + abatir", "vida": "3 días (nevera)", "masa_base": "", "ingredientes": [["Leche entera", "500", "gr", "— ver alérgenos"], ["Nata 35-38 %", "500", "gr", "— ver alérgenos"], ["Yema de huevo pasteurizada", "200", "gr", "Siempre pasteurizada, en brik — ver alérgenos"], ["Azúcar", "150", "gr", ""], ["Pasta de vainilla", "10", "gr", "O 1 vaina raspada"]], "pasos": [["1", "Poner la mariposa en las cuchillas. Pesar en el vaso las yemas pasteurizadas y el azúcar. Mezclar 30 seg / vel. 3.", "1 min", ""], ["2", "Añadir la leche, la nata y la vainilla.", "1 min", ""], ["3", "Programar 14 min / 80 °C / vel. 2 sin cubilete para que evapore.", "14 min", "80 °C"], ["4", "FIN DE COCCIÓN — CHEQUEAR TEXTURA: debe napar el dorso de la cuchara y el dedo dejar una línea limpia (82 °C con termómetro). Si no, 2 min más / 80 °C / vel. 2. Nunca pasar de 85 °C: se corta.", "hasta napar", "82 °C"], ["5", "Colar por colador fino a un recipiente frío. Enfriar en abatidor o baño de hielo hasta 4 °C en menos de 2 h.", "~40 min", "→ 4 °C"], ["6", "Envasar en biberón o táper tapado con film a contacto. Etiquetar con fecha y lote. Nevera.", "~5 min", "0-4 °C"]], "alergenos": ["Lácteos", "Huevo"], "conservacion": Volcar en el basculante el tomate triturado, el azúcar moreno, la sal y el tomillo.", "~10 min", ""], ["2", "FIN DE COCCIÓN — CHEQUEAR BRIX. Cocer a máximo fuego removiendo periódicamente hasta que el refractómetro marque 25 °Brix. Son unas 2 h 30, pero no termina por reloj: termina al llegar al Brix. Sin refractómetro, la espátula deja surco limpio en el fondo.", "hasta 25 °Bx", "máx. fuego"], ["3", "Dejar enfriar por completo antes de envasar.", "24 h", "0-4°C"], ["4", "Envasar en bolsas de 25×35 cm, 1 litro por bolsa, y sellar al vacío.", "~20 min", ""], ["5", "Etiquetar con fecha de producción y congelar.", "~5 min", "-18°C"]], "alergenos": [], "conservacion": {"Envase": "Bolsa grande al vacío", "Vida útil": "3 meses congelado", "Punto final": "25 °Brix con refractómetro", "Conservación": "Congelado en bolsa de 25×35 cm sellada al vacío, 1 L por bolsa (-18 °C)", "Descongelación": "En cámara, la bolsa entera. Una vez descongelada, no volver a congelar."}, "observaciones": "Punto final — 25 °Brix: es lo que cierra el lote, medido con refractómetro sobre una cucharada enfriada. Son unas 2 h 30 a máximo fuego en la basculante, pero no termina por reloj: termina al llegar al Brix. Rendimiento medido en obrador: ×1 = 53 kg de tomate en lata (60 kg de entrada total) y rinde 39 bolsas de 1 litro, unos 43 kg a 25 °Brix, donde la mermelada pesa ~1,1 kg por litro (×½ = 20 bolsas · ×2 = 78 bolsas). Tomillo: 4 barquetas = 160 gr en ×1. Envase: bolsa de 25×35 cm, 1 litro por bolsa, sellada al vacío. Conservación: a 25 °Brix el azúcar no conserva, este producto se conserva por frío y es obligatorio congelarlo. Enfriar 24 h antes de envasar; si se envasa en caliente se genera condensación dentro de la bolsa. Descongelar en cámara la bolsa entera; una vez descongelada, no volver a congelar. Servicio: descongelar en cámara la cantidad prevista y sacar a temperatura ambiente antes de servir.", "actualizado": "2026-09-18T12:13:54.153515+00:00", "datos": [["TAMAÑO LOTE", "×1 = 53 kg de tomate en lata"], ["RENDIMIENTO", "39 bolsas de 1 L ≈ 43 kg"], ["ENVASE", "Bolsa 25×35 cm · 1 L por bolsa"], ["EQUIPAMIENTO", "Basculante · Refractómetro · Espátula alta T° · Envasadora al vacío"], ["TIEMPO ACTIVO", "~2 h 30 de cocción + 24 h de enfriado"], ["VIDA ÚTIL", "3 meses congelado"]]}, {"codigo": "PB-OBR-SAL-028", "nombre": "ENSALADA ENFRASCADA", "tipo": "Ensalada / envasado", "rendimiento": "1 frasco", "lote": "1 frasco", "envase": "Frasco con tapa", "equipo": "Frascos · Tapas", "tiempo": "~10 min", "vida": "5 días (nevera)", "masa_base": "", "ingredientes": [["Arroz cocido", "", "", "Ya cocido y frío"], ["Edamame cocido", "", "", "Ya cocido"], ["Queso feta griego", "", "", "Lácteos — ver alérgenos"], ["Semillas tostadas", "", "", "Mezcla de semillas tostadas"], ["Pepino holandés", "", "", "Cortado"]], "pasos": [["1", "Colocar el arroz cocido (ya frío) en el fondo del frasco.", "", ""], ["2", "Añadir el edamame cocido sobre el arroz.", "", ""], ["3", "Añadir el queso feta griego.", "", ""], ["4", "Añadir las semillas tostadas.", "", ""], ["5", "Añadir el pepino holandés cortado.", "", ""], ["6", "Tapar el frasco y guardar en nevera hasta su uso (máx. 5 días).", "", "Nevera"]], "alergenos": ["Lácteos", "Soja"], "conservacion": {"Envase": "Frasco con tapa", "Vida útil": "5 días desde el envasado", "Observación": "Se elabora por frasco; se pueden preparar varios frascos a la vez. No congelar.", "Conservación": "Nevera"}, "observaciones": "Sobre la producción: La ensalada se monta por frasco, pero se pueden preparar varios frascos a la vez en cadena. Usar siempre el arroz y el edamame ya cocidos y fríos antes de envasar. Cantidades: Cantidades por frasco pendientes de definir — completar cuando se estandaricen los gramajes. Equipamiento necesario: Frascos con tapa · Recipientes para los ingredientes preparados", "actualizado": "2026-09-19T09:46:42.202847+00:00", "datos": [["TAMAÑO LOTE", "1 frasco"], ["RENDIMIENTO", "1 frasco"], ["ENVASE", "Frasco con tapa"], ["EQUIPAMIENTO", "Frascos · Tapas"], ["TIEMPO ACTIVO", "~10 min"], ["VIDA ÚTIL", "5 días (nevera)"]]}, {"codigo": "PB-OBR-SAL-029", "nombre": "MAYONESA DE PIPARRAS (DESCATALOGADA)", "tipo": "Salsa / mayonesa", "rendimiento": "3.500 gr = ~3 baldes de 1.200 gr", "lote": "1 pote (3.980 gr de mezcla)", "envase": "Balde blanco hermético de 1.200 gr", "equipo": "Termomix o Robot Coupe · Turmix · Colador · Báscula · Baldes herméticos", "tiempo": "~25 min", "vida": "1 mes en nevera", "masa_base": "", "ingredientes": [["Piparras (guindillas) en vinagre, escurridas", "380", "gr", "826 gr con líquido → 380 gr escurridas. Retirar palos y puntas antes de triturar."], ["Mayonesa", "3.600", "ml", "1 pote entero — ver alérgenos"]], "pasos": [["1", "Escurrir las guindillas y retirar los palos y las puntas. Pesar: de 826 gr con líquido quedan unos 380 gr escurridas.", "~10 min", ""], ["2", "Triturar las guindillas escurridas en Termomix o Robot Coupe hasta dejar una pasta fina, sin trozos.", "~3 min", ""], ["3", "Añadir la pasta de guindilla al pote de mayonesa.", "~2 min", ""], ["4", "Mezclar y afinar con el turmix hasta que quede homogénea, de color uniforme y sin trozos. No batir de más: la mayonesa se puede cortar.", "~3 min", ""], ["5", "Envasar en balde blanco hermético de 1.200 gr, etiquetar con fecha de producción y guardar en nevera.", "~7 min", "0-4°C"]], "alergenos": ["Huevo"], "conservacion": {"Envase": "Balde blanco hermético de 1.200 gr", "Nevera": "0-4 °C", "Vida útil": "1 mes desde la producción", "Congelación": "NO congelar"}, "observaciones": "DESCATALOGADA el 03/10/2026: ya no se elabora. No producir. Rendimiento real: tanda medida en obrador, 3.500 gr envasados (ahora en baldes de 1.200 gr) partiendo de 3.980 gr de mezcla; se pierden unos 480 gr (12 %) entre el pote, el robot y el turmix, así que el coste por kg se calcula sobre los 3.500 gr envasados. Vida útil: 1 mes en nevera (0-4 °C) desde la fecha de producción, con el balde cerrado; manda siempre lo que ocurra antes, así que si el pote de mayonesa caduca antes de ese mes la fecha del pote es la buena. Una vez abierto el balde aguanta hasta esa fecha, sacando siempre con cuchara limpia y cerrándolo después. Proporción: 380 gr de piparra escurrida por cada 3.600 ml de mayonesa = 9,5 % del total; para medio pote, 190 gr. Merma del escurrido: casi la mitad del peso del bote es líquido (826 gr con vinagre dan 380 gr de piparra, 46 % de merma); al pedir y al escandallar hay que contar con el peso escurrido. No congelar: la mayonesa es una emulsión y al congelar y descongelar se corta; los baldes van a nevera. Alérgenos: verificar la etiqueta del pote de mayonesa y del bote de piparras en cada restock, es habitual que declaren MOSTAZA y SULFITOS. Pendiente de definir: si la receta lleva algún ajuste de sal, azúcar o vinagre.", "actualizado": "2026-09-20T10:05:46.014047+00:00", "datos": [["TAMAÑO LOTE", "1 pote (3.980 gr de mezcla)"], ["RENDIMIENTO", "3.500 gr = ~3 baldes de 1.200 gr"], ["ENVASE", "Balde hermético de 1.200 gr"], ["EQUIPAMIENTO", "Termomix o Robot Coupe · Turmix"], ["TIEMPO ACTIVO", "~25 min"], ["VIDA ÚTIL", "1 mes en nevera"]]}, {"codigo": "PB-OBR-SAL-030", "nombre": "MANTEQUILLA DE SALVIA", "tipo": "Crema / untable", "rendimiento": "~3,7 kg · ~7 bolsas de 500 gr", "lote": "1 lote (~4,1 kg de ingredientes)", "envase": "Bolsa vacío mediana · 500 gr por bolsa", "equipo": "Olla de fondo grueso · Colador fino · Batidora con pala · Envasadora al vacío", "tiempo": "~35 min", "vida": "1 mes nevera · 3 meses congelado", "masa_base": "", "ingredientes": [["PARTE 1 — Mantequilla noisette con salvia", "", "", ""], ["Mantequilla", "2.000", "gr", "Para dorar (noisette). Pierde ~15 % de agua al dorar — ver alérgenos"], ["Salvia fresca (hojas)", "100", "gr", "~2,5 barquetas de 40 gr. Se infusiona y se cuela"], ["PARTE 2 — Para batir en batidora", "", "", ""], ["Mantequilla en trozos", "2.000", "gr", "Fría, cortada en trozos — ver alérgenos"], ["Salvia fresca picada fina", "20", "gr", "Hojas secas de agua, picadas a cuchillo. Da color y aroma fresco"], ["Sal Maldon", "30", "gr", "Añadir al final para que no se disuelva del todo"]], "pasos": [["1", "Derretir los 2.000 gr de mantequilla de la Parte 1 a fuego medio y cocer removiendo hasta que deje de espumar, huela a avellana y los sólidos del fondo estén dorados (noisette). No dejar que se quemen.", "~12 min", "Fuego medio"], ["2", "Apagar el fuego y añadir los 100 gr de hojas de salvia con cuidado (salpica). Dejar infusionar tapado.", "15 min", ""], ["3", "Colar la mantequilla noisette por colador fino, apretando bien las hojas. Dejar templar hasta que empiece a espesar, sin llegar a solidificar.", "~20 min", "25-30 °C"], ["4", "En la batidora con el accesorio pala: los 2.000 gr de mantequilla fría en trozos y la noisette templada. Batir hasta que quede homogéneo, sin grumos ni líquido separado.", "~5 min", ""], ["5", "Añadir la salvia picada y la sal Maldon. Batir 30 segundos más, solo para repartir.", "~1 min", ""], ["6", "Envasar en bolsas de vacío medianas de 500 gr. Etiquetar con fecha y lote. Guardar en nevera o congelar.", "~5 min", "0-4 °C"]], "alergenos": ["Lácteos"], "conservacion": {"Envase": "Bolsas de vacío medianas · 500 gr por bolsa", "Nevera": "1 mes (bolsa cerrada al vacío)", "Congelador": "3 meses", "Una vez abierta": "Consumir en 10 días en nevera"}, "observaciones": "Uso en local: Para el Salvia Grilled Cheese: sacar de nevera 30 min antes del servicio y untar en pomada las caras exteriores del pan antes de ir a la plancha. Puntos de control de calidad: La noisette debe quedar color avellana, nunca marrón oscuro ni con olor a quemado. Colar bien: una hoja de salvia cocida dentro de la bolsa acorta la vida útil. Vida útil más corta que la mantequilla de tomillo por llevar hierba fresca picada. Rendimiento: Estimado: ~3,7 kg (la noisette pierde ~300 gr de agua y parte queda en las hojas coladas). Pendiente de confirmar pesando una tanda. Equipamiento necesario: Oll function cantNum(v){
  if(v==null)return null; if(typeof v==='number')return v>0?v:null;

  if(!/^[\d.,]+$/.test(t))return null;                       // "c/n", "Hasta llenar"…
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');  // 1.234,5 (formato español)
  else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,''); // 2.000 = dos mil

}

function aBase(cant,unidad){
  const u=(unidad||'').toLowerCase().trim();
  if(u==='kg')return cant*1000;
  if(u==='g'||u==='gr'||u==='gramos')return cant;
  if(u==='l'||u==='litro'||u==='litros')return cant*1000;
  if(u==='ml')return cant;
  return cant; // ud, cajas, etc.
}
// familia de unidad para saber si son compatibles
function familia(unidad){
  const u=(unidad||'').toLowerCase().trim();
  if(['kg','g','gr','gramos'].includes(u))return 'peso';
  if(['l','litro','litros','ml'].includes(u))return 'vol';
  return 'ud';
}

  if(w.length<=3)return w;
  if(/ces$/.test(w))return w.slice(0,-3)+'z';          // nueces → nuez
  if(/[lnrdj]es$/.test(w))return w.slice(0,-2);        // limones → limon
  if(/s$/.test(w))return w.slice(0,-1);                // huevos → huevo
  return w;
}
// palabras que importan, en el orden escrito
function palabras(n){
  let s=norm(n).replace(/\([^)]*\)/g,' ').replace(/\d+(?:[.,]\d+)?\s*°?\s*c\b/g,' ').replace(/°/g,' ');
  let w=s.replace(/[^a-z0-9%ñ]+/g,' ').trim().split(' ').filter(Boolean).filter(x=>!VACIAS.includes(x)).map(singular);
  const i=w.indexOf('sin'); if(i>=0){const q=w[i+1];w.splice(i,2);if(q&&SINMARCA.includes(q))w.push('sin'+q);}   // "sin sal" no es sal; "sin gluten" si es otro producto
  w=w.filter(x=>!/\d/.test(x.replace(/%$/,'').replace(/^\d+%$/,'pct'))||/^\d+%$/.test(x)).filter(x=>!/^\d+$/.test(x)&&!DESCRIPTORES.includes(x));
  w=w.map(x=>UNIFICA[x]||x);
  if(w.some(x=>['bdja','bandeja','manojo','barqueta'].includes(x))&&!w.includes('seco')&&!w.includes('fresco'))w.push('fresco');   // en bandeja o manojo = fresco
  if(w[0]==='azucar')w=w.filter(x=>x!=='blanco'&&x!=='blanca');      // azúcar blanca = azúcar
  return w;
}
const ordenar=w=>w.slice().sort().join(' ');
const SINONIMOS_TXT={'naranja mac':'naranja','cascara de naranja':'naranja','cascaras de naranja':'naranja','limon pekin':'limon','limon pepkin':'limon','limones pekin':'limon','impulsor norte':'polvo de hornear','impulsor':'polvo de hornear','maicena':'maizena','almidon de maiz':'maizena','yema de huevo':'yema','yemas de huevo':'yema',
  'azucar impalpable':'azucar glass','azucar glas':'azucar glass','mantequilla 84%':'mantequilla laminar 84%',
  'mantequilla francesa':'mantequilla','vainilla':'pasta de vainilla','extracto de vainilla':'esencia de vainilla','sirope de arce':'jarabe de arce','la lechera':'leche condensada','lechera':'leche condensada','psilio':'psyllium','psilio rubio':'psyllium','semillas de cilantro':'cilantro molido','sal fina':'sal','sal marina':'sal','sal maldon':'sal en escamas','praline de avellana':'praline','praline avellana':'praline','te matcha':'te verde matcha','matcha':'te verde matcha','te matcha en polvo':'te verde matcha','matcha en polvo':'te verde matcha','leche de vaca':'leche'};
const SINONIMOS={}; Object.entries(SINONIMOS_TXT).forEach(([a,b])=>SINONIMOS[ordenar(palabras(a))]=ordenar(palabras(b)));
function claveBase(n){const k=ordenar(palabras(n));return SINONIMOS[k]||k;}
function clave(s){return claveBase(s);}   // compatibilidad

// La base: un ingrediente por clave, con el nombre que más usan las recetas
let _keyCache=new Map();
const BASE={};
function construirBase(){
Object.keys(BASE).forEach(k=>delete BASE[k]);
RECETAS.forEach(r=>r.i.forEach(i=>{
  if(!i.q)return; const k=claveBase(i.n); if(!k||NO_INGREDIENTE.includes(k))return;
  const b=BASE[k]||(BASE[k]={k,nombres:{}}); b.nombres[i.n]=(b.nombres[i.n]||0)+1;
}));
Object.values(BASE).forEach(b=>{
  const n=Object.entries(b.nombres).sort((x,y)=>y[1]-x[1]||x[0].length-y[0].length)[0][0];
  b.nombre=n.replace(/\s*\([^)]*\)/g,'').replace(/\s+\d+$/,'').replace(/\s+/g,' ').trim();
  b.nombre=nombreGenerico(b.nombre);
  b.nombre=b.nombre.charAt(0).toUpperCase()+b.nombre.slice(1);
});
_keyCache=new Map();
}
aplicarFilas(RECETAS_OFFLINE_ROWS);
construirBase();
// Nombre genérico para mostrar: sin marcas, envases ni apellidos ("Pimiento del piquillo asado Celorrio" → Pimiento del piquillo asado,
// "Salvia fresca" → Salvia, "Harina de fuerza ecológica" → Harina de fuerza)
function nombreGenerico(t){
  const fuera=x=>{const n=norm(x).replace(/[^a-z0-9%ñ]/g,'');if(!n)return true;const s=singular(n);
    return ((RELLENO.includes(n)||RELLENO.includes(s))&&!/^molid/.test(n))||DESCRIPTORES.includes(n)||DESCRIPTORES.includes(s)||/^\d+$/.test(n);};
  let ws=String(t).replace(/\s*\([^)]*\)/g,'').split(/\s+/).filter(Boolean);
  const q=ws.filter(x=>!fuera(x)); if(!q.length)return String(t).trim();
  while(q.length>1&&VACIAS.includes(norm(q[q.length-1])))q.pop();
  return q.join(' ');
}
function dist1(a,b){ // una letra de diferencia, sin tocar la última (pimienta ≠ pimiento)
  if(a===b)return true; if(Math.abs(a.length-b.length)>1||a.slice(-1)!==b.slice(-1))return false;
  let i=0,j=0,d=0;
  while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++d>1)return false;
    if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}
  return d+(a.length-i)+(b.length-j)<=1;
}
// Mismo producto escrito de dos maneras. Solo pares confirmados:
// 'harina de fuerza' y 'harina de fuerza ecologica' SON distintas y no van aqui.
const ALIAS={'ecologico harina sarraceno trigo':'harina sarraceno',
             'almidon ecologico fecula patata':'fecula patata'};
function keyDe(nombre){
  const t=(nombre||'').trim(); if(!t)return '';
  if(_keyCache.has(t))return _keyCache.get(t);
  const w=palabras(t), k=claveBase(t); let res=k;
  if(ALIAS[k]){_keyCache.set(t,ALIAS[k]);return ALIAS[k];}
  if(k&&!BASE[k]){
    const ks=Object.keys(BASE), wk=k.split(' ');
    // erratas: maicena → maizena, comimo → comino
    let c=ks.filter(b=>{const bw=b.split(' ');return mismoTipo(wk,bw)&&bw.length===wk.length&&wk.every((p,i)=>p===bw[i]||(p.length>=5&&dist1(p,bw[i])));});
    if(!c.length){
      // un ingrediente de la base contenido en lo escrito: "Harina de trigo sarraceno ecológico" → harina de trigo sarraceno
      // (si el de la base es de una sola palabra, solo cuando lo demás es relleno: "Canela molida", "Miel de flores")
      const tiene=p=>wk.some(x=>x===p||(p.length>=5&&dist1(p,x)));   // admite una errata: semilas/semillas
      c=ks.filter(b=>{const bw=b.split(' ');if(!mismoTipo(wk,bw)||!bw.every(tiene))return false;
        if(bw.length>=2)return true;
        return bw[0]===w[0]&&wk.filter(p=>!bw.some(q=>q===p||(p.length>=5&&dist1(p,q)))).every(p=>RELLENO.includes(p));});
      c.sort((a,b)=>b.split(' ').length-a.split(' ').length);
      if(c.length>1&&c[0].split(' ').length===c[1].split(' ').length)c=[];   // dudoso: no se fuerza
    }
    if(!c.length){ // lo escrito está entero dentro de un solo ingrediente de las recetas: "Pimiento piquillo asado" → Pimiento del piquillo asado Celorrio
      const d=ks.filter(b=>{const bw=b.split(' ');return mismoTipo(wk,bw)&&wk.length>=2&&wk.every(p=>bw.some(q=>q===p||(p.length>=5&&dist1(p,q))));});
      if(d.length===1)c=d;
    }
    if(!c.length){ // quitando el relleno: "Praline de avellanas PRA-T14" → praliné
      const k2=ordenar(wk.filter(p=>!RELLENO.includes(p))); const k3=SINONIMOS[k2]||k2;
      if(BASE[k3])c=[k3];
    }
    if(c.length)res=c[0];
    else{ // no está en las recetas: se agrupa con lo que ya haya en el catálogo escrito parecido (comimo/comino)
      const primero={}; materias.forEach(m=>{const x=claveBase(m.nombre);if(x&&(primero[x]==null||m.id<primero[x]))primero[x]=m.id;});
      const pareja=Object.keys(primero).filter(b=>{const bw=b.split(' ');return mismoTipo(wk,bw)&&bw.length===wk.length&&wk.every((p,i)=>p===bw[i]||(p.length>=5&&dist1(p,bw[i])));});
      // si ya existe el nombre genérico ("Lejía"), lo específico ("Lejía higienizante") se suma ahí
      const gen=Object.keys(primero).filter(g=>{if(BASE[g]||g===k)return false;const gw=g.split(' ');
        return mismoTipo(wk,gw)&&gw.length<wk.length&&gw.includes(w[0])&&gw.every(p=>wk.includes(p));}).sort((a,b)=>a.split(' ').length-b.split(' ').length);
      if(gen.length)res=gen[0];
      else if(pareja.length)res=pareja.sort((a,b)=>primero[a]-primero[b])[0];   // el que se dio de alta antes
    }
  }
  res=res||norm(t);
  _keyCache.set(t,res); return res;
}
const esBase=k=>!!BASE[k];
function nombreDe(k){
  if(BASE[k])return BASE[k].nombre;
  const ms=materias.filter(x=>keyDe(x.nombre)===k)
    .sort((a,b)=>(claveBase(b.nombre)===k)-(claveBase(a.nombre)===k)||a.id-b.id);
  const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  if(ms.length)return cap(ms[0].nombre);
  const l=lotes.find(x=>keyDe(x.materia)===k); return cap(l?l.materia:k);
}
function lotesGrupo(k){return lotes.filter(l=>keyDe(l.materia)===k);}
function materiasGrupo(k){return materias.filter(m=>keyDe(m.nombre)===k);}
function unidadGrupo(k){
  const us=[...materiasGrupo(k).map(m=>m.unidad),...lotesGrupo(k).map(l=>l.unidad)].filter(Boolean);
  if(!us.length)return '';
  const c={};us.forEach(u=>c[u]=(c[u]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
}
// stock del grupo en unidad base (g, ml o ud) y su familia
function stockGrupo(k){
  const ls=lotesGrupo(k); const fams=[...new Set(ls.map(l=>familia(l.unidad)))];
  const fam=fams.length===1?fams[0]:(fams.includes('peso')?'peso':(fams[0]||familia(unidadGrupo(k))));
  return {fam,base:ls.reduce((a,l)=>a+aBase(Number(l.cantidad_actual),l.unidad),0),ls};
}
function fmtCant(base,fam){
  const r=x=>nEs(Math.round(x*100)/100);
  if(fam==='peso')return base>=1000?r(base/1000)+' kg':r(base)+' gr';
  if(fam==='vol')return base>=1000?r(base/1000)+' L':r(base)+' ml';
  return r(base)+' ud';
}
function stockDe(nombre){const k=keyDe(nombre);return lotesGrupo(k).reduce((a,l)=>a+Number(l.cantidad_actual),0);}
function lotesDe(nombre){return lotesGrupo(keyDe(nombre));}

// Una fila por ingrediente de la base; suma todo lo que ha entrado con cualquier nombre equivalente.
function gruposStock(){

  materias.forEach(m=>ks.add(keyDe(m.nombre))); lotes.forEach(l=>ks.add(keyDe(l.materia)));
  ks.delete('');
  return [...ks].map(k=>{const s=stockGrupo(k);return {k,nombre:nombreDe(k),s,
    provs:[...new Set(materiasGrupo(k).map(m=>m.proveedor).filter(Boolean))],
    otros:[...new Set([...materiasGrupo(k).map(m=>m.nombre),...s.ls.map(l=>l.materia)])]};})

function invRow(g){

  }).join('  ·  ');
  const alias=g.otros.filter(o=>norm(o).trim()!==norm(g.nombre).trim());

// Debajo del nombre: a qué ingrediente se suma (solo informa, no hay que elegir nada)
function htmlDestino(texto){
  const t=(texto||'').trim(); if(t.length<2)return '';
  const k=keyDe(t), esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  if(esBase(k))return `<span class="ok-cat">✓ Se suma a <b>${esc(nombreDe(k))}</b></span>`;
  if(materiasGrupo(k).length)return `<span class="ok-cat">✓ Se suma a <b>${esc(nombreDe(k))}</b></span>`;
  { const tw=palabras(t), tk=k.split(' ');
    const esp=materias.filter(m=>{const mk=claveBase(m.nombre).split(' ');return mk.length>tk.length&&tk.every(p=>mk.includes(p))&&palabras(m.nombre)[0]===tw[0];});
    if(esp.length)return `<span class="ok-cat">✓ Se guarda como <b>${esc(bonito(t))}</b> y suma también: ${esc(esp.map(m=>m.nombre).join(', '))}</span>`; }
  return t.length>=3?'<span class="nuevo">Producto nuevo: se añadirá al catálogo.</span>':'';
}
// nombre con el que se guarda una entrada: el del ingrediente de la base
function nombreGuardar(texto){
  const t=(texto||'').trim(), k=keyDe(t);
  return (esBase(k)||materiasGrupo(k).length)?nombreDe(k):bonito(t);
}
// "LEJIA" → Lejía tal cual se escribió, pero sin gritar
function bonito(t){t=String(t).trim().replace(/\s+/g,' ');if(t===t.toUpperCase())t=t.toLowerCase();return t.charAt(0).toUpperCase()+t.slice(1);}
function recImagen(ev){

function limpiarLote(v){
  if(!v)return '';
  let s=String(v).trim();
  // quitar prefijo "LOTE" / "Lote:" / "Nº LOTE:" pero conservar el código (letras+números)
  s=s.replace(/^\s*n[º°o]?\.?\s*lote\.?\s*:?\s*/i,'');
  s=s.replace(/^\s*lote\.?\s*:?\s*/i,'');
  // cortar si quedó pegada una fecha de caducidad (F.CAD)
  s=s.replace(/\s*f\.?\s*cad\.?.*$/i,'');
  s=s.replace(/^[:\-\s]+|[:\s]+$/g,'').trim();
  return s;
}
function emparejarMateria(nombre){ return nombreGuardar(nombre); }
async function guardarRecepcion(){
  const btn=$('#guardarRec');
  if(btn&&btn.disabled)return;              // evita doble pulsación
  if(btn){btn.disabled=true;btn.textContent='⏳ Guardando…';}
  const restaurar=()=>{if(btn){btn.disabled=false;btn.textContent='Guardar recepción y sumar al stock';}};
  const prov=$('#recProv')?$('#recProv').value:'';
  const parseCant=v=>parseFloat(String(v==null?'':v).replace(',','.'));
  const validas=recLineas.filter(l=>l.materia&&l.materia.trim()&&parseCant(l.cant)>0);
  if(!validas.length){
    toast('Revisa: cada producto necesita nombre y cantidad (>0)');

  }
  // cada producto se guarda con el nombre del ingrediente de la base (azucar → Azúcar, maicena → Maizena)
  validas.forEach(l=>{l.materia=nombreGuardar(l.materia);});
  const nuevas=[...new Set(validas.filter(l=>!materiasGrupo(keyDe(l.materia)).length).map(l=>l.materia))];
  const sinLote=validas.filter(l=>!String(l.lote||'').trim());

    restaurar();return;
  }
  try{
    const {data:rec,error:e1}=await sb.from('inv_recepciones').insert(
      {fecha:hoy(),proveedor:prov,foto:recFoto,persona,nota:''}).select().single();
    if(e1){toast('Error al crear recepción: '+e1.message);restaurar();return;}
    for(const n of nuevas){
      const l=validas.find(x=>x.materia===n);
      const {error:e3}=await sb.from('inv_materias').insert({nombre:n,unidad:l.ud||'kg',proveedor:prov});
      if(e3)console.warn('alta catálogo',n,e3.message);
    }
    for(const l of validas){
      const cant=parseCant(l.cant);
      const {error:e2}=await sb.from('inv_lotes').insert({materia:l.materia.trim(),lote:l.lote||'',caducidad:l.cad||null,
        cantidad_inicial:cant,cantidad_actual:cant,unidad:l.ud||'kg',recepcion_id:rec.id,fecha_entrada:hoy()});
      if(e2){toast('Error al guardar lote ('+l.materia+'): '+e2.message);restaurar();return;}
    }
    recFoto='';recLineas=[];await cargar();toast('Recepción guardada · stock actualizado ✓');
    tab='inv';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelector('.tab[data-t="inv"]').classList.add('active');render();
  }catch(err){
    toast('Error inesperado: '+(err.message||err));restaurar();
  }
}

// Para que "4 barquetas de tomillo" y "160 gr de tomillo" se puedan restar entre sí.
// Se guarda en Supabase (tmp_archivos · cfg_peso_ud) y lo comparten todos los móviles.
let PESO_UD={}, pesoCargado=false;
const PESO_UD_FIJO={'tomillo fresco':40,'salvia fresca':40,   // 1 barqueta = 40 gr (Fran)
  'naranja':173};   // 1 naranja ≈ 173 gr (ficha del financier: 2 naranjas = 346 gr)
function pesoDesdeRecetas(){
  const p={};
  RECETAS.forEach(r=>r.i.forEach(i=>{if(!i.q)return;const k=keyDe(i.n),o=String(i.o||'');
    let m=o.match(/barquetas?\s+de\s+(\d+(?:[.,]\d+)?)\s*gr/i)||o.match(/manojos?\s+de\s+(\d+(?:[.,]\d+)?)\s*gr/i);
    if(m){p[k]=p[k]||parseFloat(m[1].replace(',','.'));return;}
    if(familia(i.u)==='ud'){m=o.match(/^\s*(\d+(?:[.,]\d+)?)\s*gr/i);if(m&&i.q)p[k]=p[k]||Math.round(parseFloat(m[1].replace(',','.'))/i.q*10)/10;}
  }));

async function guardarPeso(k,gr){

// cantidad comparable: gramos (ml cuentan como gr) o, si es "ud" y no se sabe lo que pesa, unidades
function comparable(q,u,k){
  if(familia(u)==='ud'){const p=pesoUd(k);return p?{v:q*p,f:'gr'}:{v:q,f:'ud'};}
  return {v:aBase(q,u),f:'gr'};
}
function deComparable(v,l,k){ // de gramos/ud a la unidad del lote
  const u=(l.unidad||'').toLowerCase();
  if(familia(u)==='ud'){const p=pesoUd(k);return p?v/p:v;}
  return ['kg','l','litro','litros'].includes(u)?v/1000:v;
}

async function confirmarEnvio(){
  const btn=$('#envOk'); if(btn&&btn.disabled)return;
  const lineas=envLineas.filter(l=>l.q>0);
  if(!lineas.length){toast('Pon cuánto va de cada cosa');return;}
  if(btn){btn.disabled=true;btn.textContent='Registrando…';}
  const id=await siguienteEnvio();
  const guardadas=[], incompleto=[];
  for(const l of lineas){
    if(l.manual){guardadas.push({n:l.n,q:l.q,u:l.u,manual:true,lotes:l.lote?[{lote:l.lote,caducidad:null}]:[]});continue;}
    const need=comparable(l.q,l.u,l.k);
    const usados=[]; let servido=0;
    for(const p of planLotes(l.k,need)){
      const enUnidad=deComparable(p.usar,p.l,l.k);
      const nuevo=Number(p.l.cantidad_actual)-enUnidad;
      await sb.from('inv_lotes').update({cantidad_actual:nuevo,agotado:nuevo<=0.0001}).eq('id',p.l.id);
      usados.push({lote_id:p.l.id,lote:p.l.lote||'',caducidad:p.l.caducidad||null,cantidad:Math.round(enUnidad*100)/100,unidad:p.l.unidad});
      servido+=p.usar;
    }
    if(servido<need.v-0.0001)incompleto.push(l.n);
    guardadas.push({k:l.k,n:l.n,q:l.q,u:l.u,lotes:usados});
  }
  const envio={fecha:hoy(),destino:envDest,persona:persona||'',lineas:guardadas};
  const {error}=await sb.from('tmp_archivos').insert({id,contenido:JSON.stringify(envio)});
  toast(error ? 'Stock descontado, pero no se guardó el albarán: '+error.message
              : 'Envío a '+envDest+' registrado ✓'+(incompleto.length?' · faltaba stock de: '+incompleto.join(', '):''));
  envLineas=[]; envQ=''; envCargado=false;
  await cargar(); await cargarEnvios(); renderEnvios();
  if(!error)verAlbaran(Object.assign({id},envio));
}

// Lee el rendimiento y la vida util de la ficha para proponerlos al confirmar.
const UDS_SALIDA=['gr','kg','ml','L','ud','bolsa','lata','bandeja','bote','barqueta'];
function numEs(t){   // "9.550" -> 9550 ; "1,5" -> 1.5
  const m=String(t).replace(/\.(?=\d{3}\b)/g,'').replace(',','.').match(/\d+(?:\.\d+)?/);
  return m?parseFloat(m[0]):0;
}
function rendimientoDe(cod){
  const f=RECETAS_FULL[cod]||{};
  const txt=String(f.rendimiento||'').trim();
  if(!txt)return {q:0,u:'gr'};
  // 1) si el rendimiento habla de envases, esa es la unidad con la que se guarda
  let m=txt.match(/(\d[\d.,]*)\s*(bolsas?|latas?|bandejas?|botes?|barquetas?)/i);
  if(m){const u=m[2].toLowerCase();
    return {q:numEs(m[1]), u:u.startsWith('bolsa')?'bolsa':u.startsWith('lata')?'lata':u.startsWith('bandeja')?'bandeja':u.startsWith('bote')?'bote':'barqueta'};}
  // 2) manda el PRIMER numero; la unidad es la palabra que lo sigue
  //    "6 panes de ~1 kg" -> 6 ud   |   "280 gr aprox." -> 280 gr
  m=txt.match(/(\d[\d.,]*)\s*([a-zA-ZñÑáéíóúÁÉÍÓÚ]+)/);
  if(m){
    const q=numEs(m[1]), w=m[2].toLowerCase();
    if(/^(kg|kilos?)$/.test(w))return {q,u:'kg'};
    if(/^(gr|g|gramos?)$/.test(w))return {q,u:'gr'};
    if(/^ml$/.test(w))return {q,u:'ml'};
    if(/^(l|lt|litros?)$/.test(w))return {q,u:'L'};
    return {q,u:'ud'};   // panes, pitas, placas, bagels, raciones, baldes...
  }
  // 3) por si el numero va pegado a un guion ("~1,7-1,85 kg")
  m=txt.match(/(\d[\d.,]*)\s*(kg|gr|g\b|ml|l\b|litros?)/i);
  if(m){const u=m[2].toLowerCase();
    return {q:numEs(m[1]), u:u==='kg'?'kg':u.startsWith('l')?'L':u==='ml'?'ml':'gr'};}
  return {q:numEs(txt),u:'gr'};
}
function diasVida(cod){
  const f=RECETAS_FULL[cod]||{};
  const t=String(f.vida||'').toLowerCase();
  let m=t.match(/(\d+)\s*(d[ií]as?|meses?|mes|a[nñ]os?|semanas?)/);
  if(!m)return 0;
  const n=parseInt(m[1],10), u=m[2];
  if(u.startsWith('d'))return n;
  if(u.startsWith('sem'))return n*7;
  if(u.startsWith('a'))return n*365;
  return n*30;
}

// Orden de uso de los lotes de un ingrediente: primero el elegido (si lo hay), luego el que caduca antes,
// y a igual caducidad el que entró antes (FIFO).
// Un lote con menos cantidad de la que entro es el que esta abierto: en el obrador
// se termina antes de abrir otro. Se salta si ya esta caducado.
const empezado=l=>(Number(l.cantidad_actual)<Number(l.cantidad_inicial)-0.0001&&!(l.caducidad&&l.caducidad<hoy()))?0:1;
function ordenLotes(k,elegido){
  return lotesGrupo(k).filter(l=>Number(l.cantidad_actual)>0).sort((a,b)=>
    (b.id===elegido)-(a.id===elegido)||
    empezado(a)-empezado(b)||
    (a.caducidad||'9999-12-31').localeCompare(b.caducidad||'9999-12-31')||
    (a.fecha_entrada||'').localeCompare(b.fecha_entrada||'')||a.id-b.id);
}
// qué lotes y cuánto de cada uno se gastarían (need = {v, f} en gramos o unidades)
function planLotes(k,need,elegido){
  const plan=[];let resto=need.v;
  for(const l of ordenLotes(k,elegido)){if(resto<=0.0001)break;
    const c=comparable(Number(l.cantidad_actual),l.unidad,k); if(c.f!==need.f)continue;
    const usar=Math.min(resto,c.v);plan.push({l,usar});resto-=usar;}
  return plan;
}
// Lote del producto final: código de la receta + fecha + nº del día → DUL033-261014-01
// Se mira en el registro (inv_producciones) para no repetir nunca un lote.
function prefijoLote(r){
  const m=String(r.c).match(/([A-Z]+)-(\d+)$/); const cod=m?m[1]+m[2]:String(r.c).replace(/[^A-Z0-9]/gi,'').slice(-6);
  const d=new Date(), yymmdd=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  return cod+'-'+yymmdd;
}
async function siguienteLote(r){
  const pref=prefijoLote(r);
  const {data,error}=await sb.from('inv_producciones').select('lote_final').ilike('lote_final',pref+'-%');
  if(error)throw error;
  const usados=new Set((data||[]).map(x=>x.lote_final));
  let n=1+Math.max(0,...[...usados].map(x=>parseInt(String(x).slice(pref.length+1),10)||0));
  let lote=pref+'-'+String(n).padStart(2,'0');
  while(usados.has(lote)){n++;lote=pref+'-'+String(n).padStart(2,'0');}
  return lote;
}
// ---------- PIEZAS: una misma masa da varias piezas (croissant, napolitana, bonet…) ----------
// Cada pieza tiene su propio lote, hijo del lote de la masa: DUL025-261019-01-CRO, -NAP…
let CFG_PIEZAS=null;
async function cargarCfgPiezas(){
  if(CFG_PIEZAS)return CFG_PIEZAS;
  try{const {data}=await sb.from('tmp_archivos').select('contenido').eq('id','cfg_piezas');CFG_PIEZAS=data&&data[0]?JSON.parse(data[0].contenido||'{}'):{};}catch(e){CFG_PIEZAS={};}
  return CFG_PIEZAS;
}
async function guardarCfgPiezas(cod,lista,mult){
  const c=await cargarCfgPiezas(); c[cod]=lista.map(p=>({n:p.n,q:mult?Math.round(p.q/mult*100)/100:p.q}));
  await sb.from('tmp_archivos').delete().eq('id','cfg_piezas');
  await sb.from('tmp_archivos').insert({id:'cfg_piezas',contenido:JSON.stringify(c)});
}
function llevaPiezas(r){const f=RECETAS_FULL[r.c]||{};return /lamin|boller|hojaldre/i.test(String(f.tipo||''))||!!(CFG_PIEZAS&&CFG_PIEZAS[r.c]);}
function rindePiezas(r){ // "RINDE · 70 · 140 croissants" → 70 por ×1
  const fila=r.i.find(i=>/^(rinde|rendimiento)\b/i.test(String(i.n).trim()));
  const m=fila&&String(fila.o||'').match(/(\d+(?:[.,]\d+)?)/); return m?parseFloat(m[1].replace(',','.')):null;
}
function piezasPorDefecto(r){
  const g=CFG_PIEZAS&&CFG_PIEZAS[r.c]; if(g&&g.length)return g.map(x=>({n:x.n,q:x.q}));
  const cap=t=>t.charAt(0).toUpperCase()+t.slice(1).toLowerCase();
  const lista=[{n:cap(String(r.n).split(/[—(·-]/)[0].trim()),q:rindePiezas(r)}];
  RECETAS.forEach(x=>{const f=RECETAS_FULL[x.c]||{};if(x.c!==r.c&&String(f.masa_base||'').includes(r.c))lista.push({n:cap(String(x.n).split(/[—(·]/)[0].trim()),q:null});});
  return lista;
}
function sufijoPieza(n,usados){
  const w=norm(n).replace(/[^a-z ]/g,' ').split(' ').filter(x=>x.length>2&&!VACIAS.includes(x));
  let s=((w[0]||'pie').slice(0,3)).toUpperCase(),t=s,i=2; while(usados.has(t))t=s+(i++); usados.add(t); return t;
}
function piezasHTML(){return '<div id="pzWrap" style="display:none"><label>Piezas que salen de esta masa (cada una con su lote)</label><div id="pzLista"></div>'

function leerPiezas(){return ($('#pzWrap')&&$('#pzWrap').style.display!=='none')?pzEstado.filter(p=>String(p.n).trim()&&parseFloat(p.q)>0).map(p=>({n:String(p.n).trim(),q:parseFloat(p.q)})):[];}
// Yemas de huevo entero (no pasteurizadas): la receta pide gramos de yema y se descuentan huevos
// Preparaciones que se hacen dentro de la misma receta (ej. LEAVEN PASTOSO del croissant):
// la fila de la masa se queda con su cantidad pero no se descuenta del stock, porque sus ingredientes ya se descuentan arriba
function marcarInternos(){
  RECETAS.forEach(r=>{
    const cabeza=n=>String(n).split(/[—–:(]/)[0].trim(), esMay=n=>/[A-ZÁÉÍÓÚÑ]{3}/.test(cabeza(n))&&cabeza(n)===cabeza(n).toUpperCase();
    const cab=new Set(r.i.filter(i=>!i.q&&esMay(i.n)).map(i=>claveBase(cabeza(i.n))).filter(Boolean));
    r.i=r.i.map(i=>{
      if(esMay(i.n)||!claveBase(i.n)||!cab.has(claveBase(i.n)))return i;
      if(i.q)return {...i,interno:true};   // ej. «Soaker 5.400 gr» del pan nórdico
      const m=String(i.o||'').match(/\d[\d.,]*/);
      return {...i,q:m?cantNum(m[0]):null,u:/kg/i.test(i.o)?'kg':'gr',interno:true};
    });
  });
}
// Zumo de limón: en el obrador se exprimen limones, no se compra zumo.
// Datos de la casa (fichas SAL-006 y DUL-058): 1 limón ≈ 130 gr y da ~30 ml de zumo → se descuentan limones en kg
function zumoALimon(){
  const ZUMO_POR_LIMON=30, PESO_LIMON=130;   // dentro de la función: se llama antes de que el script termine de cargar
  RECETAS.forEach(r=>r.i=r.i.map(i=>{
    if(!i.q||!/(zumo|jugo)\s+(de\s+)?lim[oó]n/i.test(i.n)||!/^(ml|l|litros?|g|gr|grs|gramos|kg)$/i.test(String(i.u).trim()))return i;
    const ml=aBase(i.q,i.u), nLim=ml/ZUMO_POR_LIMON;
    return {...i,n:'Limón (para zumo)',q:Math.round(nLim*PESO_LIMON),u:'gr',
      o:'Zumo: '+nEs(Math.round(ml))+' ml ≈ '+nEs(Math.round(nLim*10)/10)+' limones · 1 limón (~'+PESO_LIMON+' gr) da ~'+ZUMO_POR_LIMON+' ml · '+(i.o||'')};
  }));
}
function ajustarYemas(){
  const YEMA={'PB-OBR-DUL-025':18};   // croissant · 1 huevo entero = 18 gr de yema
  RECETAS.forEach(r=>{const g=YEMA[r.c]; if(!g)return;
    r.i=r.i.map(i=>{if(!i.q||!/yema/i.test(i.n)||!/^(g|gr|grs|gramos|kg)$/i.test(String(i.u).trim()))return i;
      const gr=aBase(i.q,i.u); return {...i,n:'Huevo (por las yemas)',q:Math.round(gr/g*100)/100,u:'ud',o:'Yemas de huevo entero, no pasteurizadas · 1 huevo = '+g+' gr de yema'};});});
}
async function confirmarProd(r){
  const btn=$('#pOk'); if(btn&&btn.disabled)return;
  const mult=parseFloat($('#pmult').value)||1;
  if(btn)btn.disabled=true;
  let loteFinal;
  try{loteFinal=await siguienteLote(r);}catch(e){toast('No se pudo calcular el lote: '+(e.message||e));if(btn)btn.disabled=false;return;}
  const {data:prod,error:e1}=await sb.from('inv_producciones').insert(
    {receta_cod:r.c,receta_nombre:r.n,lote_final:loteFinal,multiplicador:mult,fecha:hoy(),persona}).select().single();
  if(e1){toast('Error: '+e1.message);if(btn)btn.disabled=false;return;}
  // descontar por FIFO (primero lo que caduca antes), pasando unidades↔gramos si hace falta
  await cargarPesos();
  for(const [idx,ing] of r.i.entries()){
    if(!ing.q)continue;
    if(ing.interno||SIN_STOCK[keyDe(ing.n)])continue;
    const k=keyDe(ing.n);
    for(const {l,usar} of planLotes(k,comparable(ing.q*mult,ing.u,k),prodLote[idx])){
      const usarEnUnidadLote=deComparable(usar,l,k);
      const nuevo=Number(l.cantidad_actual)-usarEnUnidadLote;
      await sb.from('inv_lotes').update({cantidad_actual:nuevo,agotado:nuevo<=0.0001}).eq('id',l.id);
      await sb.from('inv_consumos').insert({produccion_id:prod.id,materia:l.materia,lote_id:l.id,
        lote_texto:l.lote||'',cantidad:usarEnUnidadLote,unidad:l.unidad});
    }
  }
  // lo producido entra en el stock, con su lote y su caducidad
  // piezas: cada una su lote hijo y su existencia en el stock
  const piezas=leerPiezas(); let avisoStock=''; const lotesPz=[];
  if(piezas.length){
    const usados=new Set(); const d=diasVida(r.c), cad=d?ymd(new Date(Date.now()+d*86400000)):null;
    for(const p of piezas){
      const lp=loteFinal+'-'+sufijoPieza(p.n,usados); lotesPz.push(lp+' ('+p.q+')');
      await sb.from('inv_producciones').insert({receta_cod:r.c,receta_nombre:r.n+' · '+p.n+' ('+p.q+' ud)',lote_final:lp,multiplicador:mult,fecha:hoy(),persona});
      if(!materias.some(m=>keyDe(m.nombre)===keyDe(p.n)))await sb.from('inv_materias').insert({nombre:p.n,unidad:'ud',proveedor:'Obrador',stock_min:0});
      const {error:e3}=await sb.from('inv_lotes').insert({materia:p.n,lote:lp,cantidad_inicial:p.q,cantidad_actual:p.q,unidad:'ud',caducidad:cad,fecha_entrada:hoy(),agotado:false});
      if(e3)avisoStock=' · ojo: no se pudo crear la existencia de '+p.n;
    }
    try{await guardarCfgPiezas(r.c,piezas,mult);}catch(e){}
    avisoStock=' · piezas: '+lotesPz.join(', ')+avisoStock;
  }else{
  const salida=numEs(($('#psale')||{}).value||0);
  if(salida>0){
    const uSal=(($('#psaleu')||{}).value)||'gr';
    const nomProd=nombreProducto(r);
    try{
      if(!materias.some(m=>keyDe(m.nombre)===keyDe(nomProd)))
        await sb.from('inv_materias').insert({nombre:nomProd,unidad:uSal,proveedor:'Obrador',stock_min:0});
      const d=diasVida(r.c);
      const cad=d?ymd(new Date(Date.now()+d*86400000)):null;
      const {error:e2}=await sb.from('inv_lotes').insert({materia:nomProd,lote:loteFinal,
        cantidad_inicial:salida,cantidad_actual:salida,unidad:uSal,caducidad:cad,fecha_entrada:hoy(),agotado:false});
      if(e2)avisoStock=' · ojo: no se pudo crear la existencia ('+e2.message+')';
    }catch(err){avisoStock=' · ojo: no se pudo crear la existencia';}
  }else{
    avisoStock=' · sin existencias (no pusiste cuánto salió)';
  }
  }
  $('#modal').classList.remove('show');
  await cargar();toast('Producción registrada · lote '+loteFinal+' ✓'+avisoStock);
  tab='inv';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tab[data-t="inv"]').classList.add('active');render();
}

  if((f.alergenos||[]).length)h+=`<div style="margin-top:10px;font-size:12px;color:var(--rojo);font-weight:700">Alérgenos: ${escH(f.alergenos.join(', '))}</div>`;
  if(f.conservacion&&Object.keys(f.conservacion).length)h+='<div style="margin-top:8px;font-size:12px">'+Object.entries(f.conservacion).map(([k,v])=>`<b>${escH(k)}:</b> ${escH(v)}`).join(' · ')+'</div>';
  if(f.observaciones)h+=`<div style="margin-top:8px;font-size:12px;background:var(--crema);border-radius:8px;padding:8px">${escH(f.observaciones)}</div>`;
  h+='<div class="mbtns"><button class="cancel" id="rCerrar">Cerrar</button><button class="cancel" id="rPrint">🖨 Imprimir</button>'+(obr?'<button class="ok" id="rProd">Producir</button>':'')+'</div>';
  $('#sheet').innerHTML=h; $('#modal').classList.add('show');
  const pintar=()=>{const m=parseFloat($('#rmult').value)||1;
    $('#ring').innerHTML=r.i.map(i=>i.q?`<div class="ing"><span style="flex:1">${escH(i.n)}${i.o?`<div style="font-size:10.5px;color:var(--gris)">${escH(i.o)}</div>`:''}</span><span class="q">${nEs(Math.round(i.q*m*100)/100)} ${escH(i.u)}</span></div>`
      :`<div style="font-size:11.5px;font-weight:800;color:var(--verde2);margin:8px 0 2px">${escH(i.n)}</div>`).join('');};
  pintar(); $('#rmult').oninput=pintar;
  $('#rCerrar').onclick=()=>$('#modal').classList.remove('show');
  $('#rPrint').onclick=()=>{const w=window.open('','_blank');if(!w)return;
    const c=$('#sheet').cloneNode(true);c.querySelectorAll('.mbtns,label,#rmult').forEach(e=>e.remove());
    w.document.write('<html><head><meta charset="utf-8"><title>'+escH(r.n)+'</title><style>body{font-family:Arial,sans-serif;font-size:12px;margin:24px;color:#1a1a1a}h3{color:#1A3A1C}.ing{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #eee}.q{font-weight:bold}</style></head><body>'+c.innerHTML+'</body></html>');
    w.document.close();w.focus();w.print();};
  if($('#rProd'))$('#rProd').onclick=()=>{const m=$('#rmult').value;$('#modal').classList.remove('show');
    tab='prod';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t==='prod'));
    renderProducir();abrirProd(cod);const pm=$('#pmult');if(pm){pm.value=m;pm.oninput();}};
}

// ---------- TRAZABILIDAD ----------
let trazaQ='';
async function renderTraza(){
  let h='<div class="wrap"><h3 class="sec">Buscar trazabilidad de un lote</h3>';
  h+='<input id="tsearch" placeholder="Buscar lote o receta…" value="'+trazaQ+'">';
  h+='<div id="trazaRes"></div></div>';
  $('#app').innerHTML=h;
  $('#tsearch').oninput=e=>{trazaQ=e.target.value;buscarTraza();};
  buscarTraza();
}
async function buscarTraza(){
  const cont=$('#trazaRes'); if(!cont)return;
  const t=trazaQ.trim();
  if(!t){
    const {data:ult}=await sb.from('inv_producciones').select('*').order('id',{ascending:false}).limit(60);
    if(!ult||!ult.length){cont.innerHTML='<div class="empty">Todavía no hay producciones registradas.</div>';return;}
    let h='<h3 class="sec" style="margin-top:12px">Registro de lotes · últimos '+ult.length+'</h3><div class="card">';
    ult.forEach(p=>h+=`<div class="prodrow" data-lote="${String(p.lote_final).replace(/"/g,'&quot;')}"><div class="t">${p.lote_final}</div>
      <div class="s">${p.receta_nombre} · ${p.fecha} · ×${p.multiplicador} · ${p.persona||'—'}</div></div>`);
    cont.innerHTML=h+'</div>';
    cont.querySelectorAll('[data-lote]').forEach(el=>el.onclick=()=>{trazaQ=el.dataset.lote;$('#tsearch').value=trazaQ;buscarTraza();});
    return;
  }
  const {data:prods}=await sb.from('inv_producciones').select('*').or('lote_final.ilike.%'+t.replace(/[,()%]/g,' ')+'%,receta_nombre.ilike.%'+t.replace(/[,()%]/g,' ')+'%').order('fecha',{ascending:false});
  if(!prods||!prods.length){cont.innerHTML='<div class="empty">No se encontró ese lote.</div>';return;}
  let h='';
  for(const p of prods){
    let {data:cons}=await sb.from('inv_consumos').select('*').eq('produccion_id',p.id); let padre='';
    if((!cons||!cons.length)&&/-[A-Z]{3}\d*$/.test(p.lote_final)){const lp=p.lote_final.replace(/-[A-Z]{3}\d*$/,'');
      const {data:pp}=await sb.from('inv_producciones').select('id').eq('lote_final',lp).limit(1);
      if(pp&&pp[0]){padre=lp;cons=(await sb.from('inv_consumos').select('*').eq('produccion_id',pp[0].id)).data;}}
    h+=`<div class="traza"><b>${p.receta_nombre}</b> · lote <b>${p.lote_final}</b><br>
      <span style="font-size:11.5px;color:var(--gris)">${p.fecha} · ×${p.multiplicador} · por ${p.persona||'—'}</span>
      <div style="margin-top:8px;font-size:12.5px">Materias primas usadas${padre?' (de la masa, lote <b>'+padre+'</b>)':''}:</div>`;
    if(cons&&cons.length){
      cons.forEach(c=>{h+=`<div style="font-size:12.5px;padding:3px 0;border-bottom:1px solid #eadfce">
        • ${c.materia} — lote <b>${c.lote_texto||'s/lote'}</b> — ${nEs(Math.round(c.cantidad*100)/100)} ${c.unidad||''}</div>`;});
    }else h+='<div style="font-size:12px;color:var(--gris)">Sin consumos registrados.</div>';
    h+='</div>';
  }
  cont.innerHTML=h;
}

init();
</script>
